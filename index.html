<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DropIntel Pro</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #e0e0e0; font-family: 'Courier New', monospace; min-height: 100vh; }
header { background: linear-gradient(135deg, #0d0d1a, #1a0d2e, #0d1a0d); border-bottom: 1px solid #00e5a020; padding: 16px 20px; position: sticky; top: 0; z-index: 100; }
.header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.logo span:first-child { color: #00e5a0; font-size: 22px; font-weight: 900; }
.logo span:last-child { color: #ff4d4d; font-size: 22px; font-weight: 900; }
.logo-sub { color: #ffd700; font-size: 14px; font-weight: 900; margin-left: 6px; }
.subtitle { color: #444; font-size: 9px; letter-spacing: 1px; margin-top: 2px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { background: #111; color: #555; border: 1px solid #222; padding: 8px 16px; border-radius: 2px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 1px; transition: all 0.2s; }
.tab.active { background: #00e5a0; color: #000; border-color: #00e5a0; font-weight: 700; }
main { max-width: 1200px; margin: 0 auto; padding: 20px 14px; }
.setup-box { background: #0d0d16; border: 1px solid #00e5a020; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
.setup-label { color: #00e5a0; font-size: 10px; letter-spacing: 3px; margin-bottom: 12px; }
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.setup-field label { color: #444; font-size: 9px; letter-spacing: 2px; display: block; margin-bottom: 6px; }
.setup-field input { width: 100%; background: #0a0a0a; border: 1px solid #00e5a030; border-radius: 3px; padding: 10px 14px; color: #e0e0e0; font-family: 'Courier New', monospace; font-size: 11px; outline: none; }
.btn-primary { background: linear-gradient(135deg, #00e5a0, #00b37a); color: #000; border: none; padding: 10px 24px; border-radius: 3px; cursor: pointer; font-family: 'Courier New', monospace; font-weight: 700; font-size: 11px; letter-spacing: 2px; margin-top: 12px; }
.btn-secondary { background: #111; color: #555; border: 1px solid #222; padding: 8px 16px; border-radius: 2px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 1px; }
.status-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.status-item { display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 1px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; }
.status-dot.green { background: #00e5a0; }
.status-dot.red { background: #ff4d4d; }
.section { display: none; }
.section.active { display: block; }
.error-box { background: #1a0d0d; border: 1px solid #ff4d4d30; border-radius: 4px; padding: 14px; margin-bottom: 16px; color: #ff4d4d; font-size: 11px; }
.success-box { background: #0d1a0d; border: 1px solid #00e5a030; border-radius: 4px; padding: 14px; margin-bottom: 16px; color: #00e5a0; font-size: 11px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 20px; }
.stat-card { background: #111118; border-radius: 4px; padding: 12px 14px; }
.stat-val { font-size: 20px; font-weight: 900; }
.stat-label { font-size: 8px; letter-spacing: 2px; margin-top: 3px; color: #333; }
.filters { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-btn { background: #111118; color: #555; border: 1px solid #222; padding: 5px 10px; border-radius: 2px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 1px; }
.filter-btn.active { background: #00e5a0; color: #000; border-color: #00e5a0; font-weight: 700; }
.loading { text-align: center; padding: 70px 0; }
.loading-text { color: #00e5a0; font-size: 11px; letter-spacing: 4px; margin-bottom: 14px; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dot { width: 6px; height: 6px; background: #00e5a0; border-radius: 50%; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.2;transform:scale(1)} 50%{opacity:1;transform:scale(1.4)} }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { background: #0e0e16; border: 1px solid #1a1a2e; border-radius: 4px; padding: 16px; transition: all 0.2s; position: relative; overflow: hidden; }
.card:hover { border-color: #00e5a030; }
.card.selected { border-color: #00e5a0; background: #0d1a0d; }
.trend-bar { position: absolute; top: 0; left: 0; height: 2px; }
.cat-tag { background: #1a1a2e; color: #333; font-size: 8px; padding: 2px 6px; border-radius: 2px; letter-spacing: 1px; }
.card-title { font-size: 13px; font-weight: 700; margin: 8px 0 6px; line-height: 1.3; }
.card-why { font-size: 10px; color: #444; margin-bottom: 12px; line-height: 1.5; }
.prices { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-bottom: 10px; text-align: center; }
.price-val { font-size: 12px; font-weight: 700; }
.price-label { font-size: 8px; color: #333; letter-spacing: 1px; margin-top: 2px; }
.card-footer { display: flex; justify-content: space-between; align-items: center; }
.platform-tag { background: #1a1a2e; color: #333; font-size: 8px; padding: 2px 5px; border-radius: 2px; margin-right: 4px; }
.score-bar { width: 26px; height: 3px; background: #1a1a2e; border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 3px; }
.score-fill { height: 100%; border-radius: 2px; }
.score-num { font-size: 11px; font-weight: 700; vertical-align: middle; }
.select-btn { background: #00e5a020; color: #00e5a0; border: 1px solid #00e5a040; padding: 6px 10px; border-radius: 2px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 1px; margin-top: 10px; width: 100%; }
.select-btn.selected { background: #00e5a0; color: #000; font-weight: 700; }
